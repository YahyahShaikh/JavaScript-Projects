<!doctype html>
<html lang="en">

<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <style>
        .a1 {
            height: 600px;
            width: 30%;
            background-color: #a4edbd;
        }

        form {
            padding: 30px 0 0 30px;
        }

        button {
            margin-left: 10px;
            width: 90%;
            background-color: green;
            color: white;
        }

        h3 {
            margin: 30px 0 0 80px;
        }

        main {
            background-color: antiquewhite;
            height: 100%;
        }
        #errorMsg{
            text-align: center;
            color: red;
        }
    </style>
</head>

<body>
    <header>
        <!-- place navbar here -->
    </header>
    <main class="d-flex justify-content-center align-items-center mt-5">

        <div class="a1">
            <h3>Registration Form</h3>
            <form action="" id="form">
                <label for="">Name :</label> <br>
                <input type="text" style="width: 90%;" id="name"> <br>

                <label for="">Email :</label> <br>
                <input type="email" style="width: 90%;" id="email"> <br>

                <label for="">Password : </label> <br>
                <input type="password" style="width: 90%;" id="password"><br><br>

                Gender : 
                <input type="radio" name="gender" value="male"> Male
                <input type="radio" name="gender" value="female"> Female
                <br><br>

                Select your hobbies :
                <input type="checkbox" name="hobbies" value="Dancing" id=""> Dancing
                <input type="checkbox" name="hobbies" value="Singing" id=""> Singing
                <input type="checkbox" name="hobbies" value="Coding" id=""> Coding
                <input type="checkbox" name="hobbies" value="Painting" id=""> Painting
                <br><br>

                <input type="checkbox" id="terms" > I Accept the terms and conditions
                <br><br>

                <button type="submit">Submit</button>

                <p id="errorMsg"></p>
                <p id="successMsg"></p>

        <script src="form.js"></script>
    </form>
</div>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
</body>

</html>
